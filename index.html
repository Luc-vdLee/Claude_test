<meta charset="utf-8">
<title>Interval Finder</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Intervals">
<meta name="theme-color" content="#F2F4F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Noto+Music&display=swap">
<style>
  /* Layout: one phone-width column. Result first, keyboard as the visual anchor,
     then note controls, then the "why" and a tap-to-try interval chart. */
  :root {
    --paper: #F2F4F7;
    --surface: #FFFFFF;
    --ink: #17202D;
    --muted: #5A6577;
    --line: #D6DCE4;
    --one: #0D7A69;
    --one-soft: #D5EEE9;
    --two: #B0601C;
    --two-soft: #F6E3D1;
    --key-white: #FCFDFE;
    --key-black: #1D2430;
    --key-edge: #B9C2CF;
    --perfect: #0D7A69;
    --imperfect: #3A68B0;
    --dissonant: #B23347;

    --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, "Noto Music", serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", "Noto Music", sans-serif;
    --data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, "Noto Music", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0E131A; --surface: #171E29; --ink: #E7EBF0; --muted: #97A2B2; --line: #283241;
      --one: #45C4AD; --one-soft: #173832; --two: #E89A55; --two-soft: #3D2A1B;
      --key-white: #DCE2EA; --key-black: #070A0E; --key-edge: #8E99A8;
      --perfect: #45C4AD; --imperfect: #7FA6EA; --dissonant: #EE7A8C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0E131A; --surface: #171E29; --ink: #E7EBF0; --muted: #97A2B2; --line: #283241;
    --one: #45C4AD; --one-soft: #173832; --two: #E89A55; --two-soft: #3D2A1B;
    --key-white: #DCE2EA; --key-black: #070A0E; --key-edge: #8E99A8;
    --perfect: #45C4AD; --imperfect: #7FA6EA; --dissonant: #EE7A8C;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 400 1rem/1.5 var(--body);
    padding-inline: 16px;
    padding-block: 20px 48px;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 34rem; margin: 0 auto; display: grid; gap: 1.5rem; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--one); outline-offset: 2px; }

  .eyebrow {
    font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  h2 { font: 600 .78rem/1.2 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }

  /* Result */
  .result { display: grid; gap: .6rem; }
  .result-name {
    font: 700 clamp(2.3rem, 11vw, 3.4rem)/1 var(--display);
    margin: 0; text-wrap: balance; text-transform: capitalize;
  }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip {
    display: inline-flex; align-items: center; gap: .4rem;
    border: 1px solid var(--line); border-radius: 999px; padding: .2rem .65rem;
    font-size: .85rem; background: var(--surface); white-space: nowrap;
  }
  .chip.code { font-family: var(--data); font-weight: 500; }
  .chip .dot { width: .55rem; height: .55rem; border-radius: 50%; background: currentColor; }
  .chip.perfect { color: var(--perfect); }
  .chip.imperfect { color: var(--imperfect); }
  .chip.dissonant { color: var(--dissonant); }

  /* Keyboard */
  .kb-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 8px; }
  .keyboard { position: relative; height: 150px; min-width: 100%; }
  .key { position: absolute; top: 0; border: 0; padding: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; }
  .key.white {
    height: 100%; background: var(--key-white); border: 1px solid var(--key-edge); border-radius: 0 0 6px 6px;
    padding-bottom: 8px;
  }
  .key.black {
    height: 60%; background: var(--key-black); border-radius: 0 0 4px 4px; z-index: 2; padding-bottom: 5px;
  }
  .key.white.is-0 { background: var(--one-soft); }
  .key.white.is-1 { background: var(--two-soft); }
  .key.white.is-0.is-1 { background: linear-gradient(90deg, var(--one-soft) 50%, var(--two-soft) 50%); }
  .key .c-label { font: 500 .6rem var(--data); color: var(--muted); }
  .marker {
    min-width: 1.6rem; padding: 2px 4px; border-radius: 999px; font: 600 .7rem/1.2 var(--body);
    color: var(--surface); text-align: center; white-space: nowrap;
  }
  .marker.n0 { background: var(--one); }
  .marker.n1 { background: var(--two); }
  .key.black .marker { min-width: 0; font-size: .6rem; padding: 2px 3px; }

  /* Note pickers */
  .notes { display: grid; grid-template-columns: 1fr auto 1fr; gap: .5rem; align-items: stretch; }
  .note-card {
    display: grid; gap: .1rem; text-align: left; padding: .7rem .9rem;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px;
  }
  .note-card .label { font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .note-card .value { font: 700 2rem/1.1 var(--display); }
  #note-0 .label { color: var(--one); }
  #note-1 .label { color: var(--two); }
  #note-0[aria-pressed="true"] { border-color: var(--one); box-shadow: 0 0 0 3px var(--one-soft); }
  #note-1[aria-pressed="true"] { border-color: var(--two); box-shadow: 0 0 0 3px var(--two-soft); }
  .swap {
    align-self: center; width: 2.6rem; height: 2.6rem; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface); font-size: 1.1rem;
  }

  .editor { display: grid; gap: .6rem; }
  .row { display: grid; gap: .35rem; }
  .letters { grid-template-columns: repeat(7, 1fr); }
  .accs { grid-template-columns: repeat(5, 1fr); }
  .seg {
    min-height: 2.75rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
    font-weight: 600; font-size: 1.05rem;
  }
  .seg[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .octave-row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .octave-row .seg { width: 2.75rem; }
  .octave-row output { min-width: 2ch; text-align: center; font: 500 1.1rem var(--data); }
  .octave-row .hint { color: var(--muted); font-size: .85rem; }
  .play {
    margin-left: auto; min-height: 2.75rem; padding: 0 1.1rem; border-radius: 999px; border: 0;
    background: var(--ink); color: var(--paper); font-weight: 600;
  }

  /* Explanation */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; display: grid; gap: .75rem; }
  .panel p { margin: 0; max-width: 62ch; }
  .steps { display: flex; flex-wrap: wrap; gap: .25rem; list-style: none; margin: 0; padding: 0; }
  .steps li {
    min-width: 2rem; padding: .25rem .4rem; text-align: center; border-radius: 6px;
    background: var(--paper); font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .steps li small { display: block; font: 500 .6rem var(--data); color: var(--muted); }
  .steps li.first { background: var(--one); color: var(--surface); }
  .steps li.last { background: var(--two); color: var(--surface); }
  .steps li.first small, .steps li.last small { color: inherit; opacity: .8; }
  .muted { color: var(--muted); font-size: .9rem; }
  .code { font-family: var(--data); }

  /* Chart */
  .chart { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .chart li + li { border-top: 1px solid var(--line); }
  .chart button {
    width: 100%; display: grid; grid-template-columns: 3rem 1fr auto 3.4rem; gap: .5rem; align-items: center;
    padding: .6rem .9rem; border: 0; background: transparent; text-align: left;
  }
  .chart button[aria-current="true"] { background: var(--two-soft); }
  .chart .short { font: 500 .9rem var(--data); }
  .chart .nm { text-transform: capitalize; min-width: 0; }
  .chart .st { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; text-align: right; }
  .chart .to { font-weight: 700; color: var(--two); text-align: right; }

  @media (prefers-reduced-motion: no-preference) {
    .result-name { transition: opacity .15s; }
    .seg, .note-card, .key { transition: background-color .12s, border-color .12s, box-shadow .12s; }
  }
</style>

<main>
  <header>
    <div class="eyebrow">Interval Finder</div>
  </header>

  <section class="result" aria-live="polite">
    <h1 class="result-name" id="result-name">Perfect fifth</h1>
    <div class="chips" id="result-chips"></div>
  </section>

  <div class="kb-wrap">
    <div class="keyboard" id="keyboard" role="group" aria-label="Piano keyboard. Tap a key to set the selected note."></div>
  </div>

  <section class="notes">
    <button class="note-card" id="note-0" type="button" aria-pressed="false">
      <span class="label">First note</span><span class="value" id="note-0-value">C4</span>
    </button>
    <button class="swap" id="swap" type="button" aria-label="Swap notes">⇄</button>
    <button class="note-card" id="note-1" type="button" aria-pressed="true">
      <span class="label">Second note</span><span class="value" id="note-1-value">G4</span>
    </button>
  </section>

  <section class="editor" aria-label="Edit selected note">
    <div class="row letters" id="letters"></div>
    <div class="row accs" id="accs"></div>
    <div class="octave-row">
      <button class="seg" id="oct-down" type="button" aria-label="Octave down">−</button>
      <output id="oct-value">4</output>
      <button class="seg" id="oct-up" type="button" aria-label="Octave up">+</button>
      <span class="hint">octave</span>
      <button class="play" id="play" type="button">▶ Play</button>
    </div>
  </section>

  <section class="panel" id="why">
    <h2>How it's worked out</h2>
    <p id="why-size"></p>
    <ol class="steps" id="why-steps"></ol>
    <p id="why-quality"></p>
    <p id="why-inversion" class="muted"></p>
  </section>

  <section style="display:grid;gap:.6rem">
    <h2 id="chart-title">Intervals from C4</h2>
    <ul class="chart" id="chart"></ul>
    <p class="muted">Tap a row to set the second note.</p>
  </section>
</main>

<script type="module">
  import {
    LETTERS, note, noteName, accidentalSymbol, midi, frequency, interval, transpose,
    intervalNumberName, QUALITY_NAMES, COMMON_INTERVALS,
  } from './intervals.js';

  const STORAGE_KEY = 'interval-finder:v1';
  const state = { notes: [note('C', 0, 4), note('G', 0, 4)], active: 1 };
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved?.notes?.length === 2) {
      state.notes = saved.notes.map((n) => note(n.letter, n.accidental, n.octave));
      state.active = saved.active === 0 ? 0 : 1;
    }
  } catch {}

  const $ = (id) => document.getElementById(id);
  const NUMBER_WORDS = ['zero', 'one', 'two', 'three', 'four'];
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const CONSONANCE_LABEL = { perfect: 'Perfect consonance', imperfect: 'Imperfect consonance', dissonant: 'Dissonance' };

  // Static controls
  $('letters').innerHTML = LETTERS.map((l) => `<button class="seg" type="button" data-letter="${l}">${l}</button>`).join('');
  $('accs').innerHTML = [-2, -1, 0, 1, 2].map((a) =>
    `<button class="seg" type="button" data-acc="${a}" aria-label="${['double flat', 'flat', 'natural', 'sharp', 'double sharp'][a + 2]}">${a === 0 ? '♮' : accidentalSymbol(a)}</button>`
  ).join('');

  function setActiveNote(n) {
    state.notes[state.active] = n;
    render();
  }

  $('letters').addEventListener('click', (e) => {
    const l = e.target.closest('[data-letter]')?.dataset.letter;
    if (!l) return;
    const n = state.notes[state.active];
    setActiveNote(note(l, n.accidental, n.octave));
  });
  $('accs').addEventListener('click', (e) => {
    const a = e.target.closest('[data-acc]')?.dataset.acc;
    if (a === undefined) return;
    const n = state.notes[state.active];
    setActiveNote(note(n.letter, Number(a), n.octave));
  });
  $('oct-down').addEventListener('click', () => {
    const n = state.notes[state.active];
    if (n.octave > 1) setActiveNote(note(n.letter, n.accidental, n.octave - 1));
  });
  $('oct-up').addEventListener('click', () => {
    const n = state.notes[state.active];
    if (n.octave < 7) setActiveNote(note(n.letter, n.accidental, n.octave + 1));
  });
  [0, 1].forEach((i) => $(`note-${i}`).addEventListener('click', () => { state.active = i; render(); }));
  $('swap').addEventListener('click', () => {
    state.notes.reverse();
    state.active = 1 - state.active;
    render();
  });

  // Keyboard: white keys spell as naturals, black keys as sharps.
  const PC_SPELLING = { 0: ['C', 0], 1: ['C', 1], 2: ['D', 0], 3: ['D', 1], 4: ['E', 0], 5: ['F', 0], 6: ['F', 1], 7: ['G', 0], 8: ['G', 1], 9: ['A', 0], 10: ['A', 1], 11: ['B', 0] };
  const WHITE_PCS = [0, 2, 4, 5, 7, 9, 11];

  $('keyboard').addEventListener('click', (e) => {
    const key = e.target.closest('[data-midi]');
    if (!key) return;
    const m = Number(key.dataset.midi);
    const [letter, acc] = PC_SPELLING[m % 12];
    const n = note(letter, acc, Math.floor(m / 12) - 1);
    setActiveNote(n);
    playTones([[frequency(n), 0, 0.6]]);
  });

  function renderKeyboard() {
    const pitches = state.notes.map(midi);
    let lowOct = Math.floor(Math.min(...pitches) / 12) - 1;
    let highOct = Math.floor(Math.max(...pitches) / 12) - 1;
    if (highOct === lowOct) highOct++;
    const whiteCount = (highOct - lowOct + 1) * 7;
    const startMidi = (lowOct + 1) * 12;
    const endMidi = (highOct + 2) * 12 - 1;
    const kb = $('keyboard');
    kb.style.width = `max(100%, ${whiteCount * 26}px)`;

    const markers = (m, black) => state.notes
      .map((n, i) => (midi(n) === m ? `<span class="marker n${i}">${noteName(n, !black)}</span>` : ''))
      .join('');

    let html = '';
    let whiteIndex = 0;
    const w = 100 / whiteCount;
    for (let m = startMidi; m <= endMidi; m++) {
      const pc = m % 12;
      const cls = state.notes.map((n, i) => (midi(n) === m ? ` is-${i}` : '')).join('');
      const [l, a] = PC_SPELLING[pc];
      const label = `${l}${a ? '♯' : ''}${Math.floor(m / 12) - 1}`;
      if (WHITE_PCS.includes(pc)) {
        html += `<button type="button" class="key white${cls}" data-midi="${m}" aria-label="${label}"
          style="left:${whiteIndex * w}%;width:${w}%">${markers(m, false)}${pc === 0 ? `<span class="c-label">C${Math.floor(m / 12) - 1}</span>` : ''}</button>`;
        whiteIndex++;
      } else {
        const bw = w * 0.62;
        html += `<button type="button" class="key black${cls}" data-midi="${m}" aria-label="${label}"
          style="left:${whiteIndex * w - bw / 2}%;width:${bw}%">${markers(m, true)}</button>`;
      }
    }
    kb.innerHTML = html;
  }

  function renderExplanation(r) {
    const lo = noteName(r.lower), hi = noteName(r.upper);
    const sizeName = intervalNumberName(r.number);
    let size = `Count the letter names from ${lo} up to ${hi}, including both ends. That makes ${r.number}, so it's a <strong>${sizeName}</strong>.`;
    if (r.octaves > 0 && r.simpleNumber !== 1) {
      size += ` That's ${r.octaves === 1 ? 'an octave' : `${r.octaves} octaves`} plus a ${intervalNumberName(r.simpleNumber)}.`;
    }
    if (r.direction === 'descending') size = `The second note is lower, so we measure from ${lo} up to ${hi}. ` + size;
    $('why-size').innerHTML = size;

    $('why-steps').innerHTML = r.letters.map((l, i) =>
      `<li class="${i === 0 ? 'first' : i === r.letters.length - 1 ? 'last' : ''}">${l}<small>${i + 1}</small></li>`
    ).join('');

    const baseQuality = r.isPerfectType ? 'perfect' : 'major';
    const diff = r.semitones - r.baseSemitones;
    let quality;
    if (!r.quality) {
      quality = `A ${baseQuality} ${sizeName} spans ${plural(r.baseSemitones, 'semitone')}, but this one spans ${r.semitones}. That's too far off to have a standard name, so try a different spelling.`;
    } else {
      const amount = Math.abs(diff);
      const compare = diff === 0 ? 'exactly that' : `${NUMBER_WORDS[amount] ?? amount} ${diff < 0 ? 'fewer' : 'more'}`;
      quality = `A ${baseQuality} ${sizeName} spans ${plural(r.baseSemitones, 'semitone')}. ${lo} to ${hi} spans ${r.semitones}, ${compare}, so it's <strong>${QUALITY_NAMES[r.quality]}</strong>.`;
      if (r.isPerfectType && r.quality !== 'P') quality += ` Unisons, fourths, fifths and octaves are never major or minor: they're perfect, augmented or diminished.`;
    }
    $('why-quality').innerHTML = quality;

    $('why-inversion').innerHTML = r.inversion
      ? `Flip it so ${noteName(r.upper, false)} is on the bottom and the ${r.name} becomes a ${r.inversion.name} (<span class="code">${r.inversion.shortName}</span>). A simple interval and its inversion always add up to 9.`
      : '';
  }

  function renderChart(r) {
    const root = state.notes[0];
    $('chart-title').textContent = `Intervals from ${noteName(root)}`;
    $('chart').innerHTML = COMMON_INTERVALS.map((iv, i) => {
      const to = transpose(root, iv.number, iv.quality);
      const current = r.direction !== 'descending' && r.shortName === iv.shortName;
      return `<li><button type="button" data-i="${i}" ${to ? '' : 'disabled'} aria-current="${current}">
        <span class="short">${iv.shortName}</span><span class="nm">${iv.name}</span>
        <span class="st">${iv.semitones} st</span>
        <span class="to">${to ? noteName(to) : '—'}</span></button></li>`;
    }).join('');
  }
  $('chart').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-i]');
    if (!btn) return;
    const iv = COMMON_INTERVALS[Number(btn.dataset.i)];
    const to = transpose(state.notes[0], iv.number, iv.quality);
    if (!to) return;
    state.notes[1] = to;
    state.active = 1;
    render();
    playInterval();
  });

  function render() {
    const r = interval(state.notes[0], state.notes[1]);
    $('result-name').textContent = r.name;
    const chips = [
      `<span class="chip code">${r.shortName}</span>`,
      `<span class="chip">${plural(r.semitones, 'semitone')}</span>`,
      `<span class="chip ${r.consonance}"><span class="dot"></span>${CONSONANCE_LABEL[r.consonance]}</span>`,
    ];
    if (r.direction !== 'same') chips.push(`<span class="chip">${r.direction === 'ascending' ? '↑ Ascending' : '↓ Descending'}</span>`);
    if (r.isTritone) chips.push(`<span class="chip">Tritone</span>`);
    $('result-chips').innerHTML = chips.join('');

    state.notes.forEach((n, i) => {
      $(`note-${i}-value`).textContent = noteName(n);
      $(`note-${i}`).setAttribute('aria-pressed', String(state.active === i));
    });
    const n = state.notes[state.active];
    document.querySelectorAll('[data-letter]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.letter === n.letter)));
    document.querySelectorAll('[data-acc]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.acc) === n.accidental)));
    $('oct-value').textContent = n.octave;

    renderKeyboard();
    renderExplanation(r);
    renderChart(r);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  }

  // Sound: each tone is [frequency, start offset in s, duration in s].
  let audio;
  function playTones(tones) {
    try {
      audio ??= new (window.AudioContext || window.webkitAudioContext)();
      audio.resume();
      const t0 = audio.currentTime + 0.05;
      for (const [freq, start, dur] of tones) {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t0 + start);
        gain.gain.exponentialRampToValueAtTime(0.22, t0 + start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur);
        osc.connect(gain).connect(audio.destination);
        osc.start(t0 + start);
        osc.stop(t0 + start + dur + 0.05);
      }
    } catch {}
  }
  function playInterval() {
    const [a, b] = state.notes.map(frequency);
    playTones([[a, 0, 0.7], [b, 0.75, 0.7], [a, 1.6, 1.6], [b, 1.6, 1.6]]);
  }
  $('play').addEventListener('click', playInterval);

  render();
</script>
